name: Refresh Traffic Dashboard

# Kept separate from Auto Deals so the /admin dashboard can refresh several times
# a day and is never blocked by (or waiting on) the ~25min deal scrape.
on:
  schedule:
    - cron: "5 */6 * * *"   # every 6 hours, just past the hour
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet google-auth requests

      - name: Pull GA4 numbers
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: python fetch_analytics.py

      - name: Commit if changed
        run: |
          git config user.name "deal-bot"
          git config user.email "bot@invisuale.com"
          git add admin-data.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "refresh traffic dashboard"
          git pull --rebase origin main || true
          git push
