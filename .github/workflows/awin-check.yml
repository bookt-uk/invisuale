name: Awin token check (temporary)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          pid, tok = os.environ["AWIN_PUBLISHER_ID"], os.environ["AWIN_API_TOKEN"]
          print("token length:", len(tok.strip()), "| has whitespace/newline:", tok != tok.strip())
          for name, req in [
              ("programmes", urllib.request.Request(f"https://api.awin.com/publishers/{pid}/programmes/?relationship=joined", headers={"Authorization": f"Bearer {tok.strip()}"})),
              ("offers", urllib.request.Request(f"https://api.awin.com/publisher/{pid}/promotions", method="POST", data=json.dumps({"filters": {"membership": "joined", "status": "active", "type": "all", "regionCodes": ["GB"]}, "pagination": {"page": 1, "pageSize": 200}}).encode(), headers={"Authorization": f"Bearer {tok.strip()}", "Content-Type": "application/json"})),
          ]:
              try:
                  d = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  print(name, "OK:", len(d) if isinstance(d, list) else len(d.get("data") or []))
              except urllib.error.HTTPError as e:
                  print(name, "HTTP", e.code)
          PY
