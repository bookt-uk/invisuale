name: Auto Deals

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  post-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deal poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_ASSOCIATES_TAG: ${{ secrets.AMAZON_ASSOCIATES_TAG }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        run: python auto_deals.py

      - name: Save state
        run: |
          git config user.name "deal-bot"
          git config user.email "bot@invisuale.com"
          # Commit BEFORE pulling: rebasing with uncommitted changes fails, and the
          # analytics bot can push while this ~25 min run is going.
          git add -A
          git commit -m "update deals" || echo "nothing to commit"
          git pull --rebase origin main
          git push

      # Google retired its sitemap ping in 2023. IndexNow tells Bing (which also feeds
      # ChatGPT search and Copilot) about the pages that change daily. The key is
      # public by design: it's served at https://invisuale.com/42b5685d4384e274358a5b5fb3768deb.txt
      - name: Notify IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "42b5685d4384e274358a5b5fb3768deb"
          locs = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          urls = [u for u in locs if u == "https://invisuale.com/" or any(p in u for p in ("/black-friday/", "/categories/", "/codes/"))]
          body = json.dumps({"host": "invisuale.com", "key": key, "keyLocation": f"https://invisuale.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, "for", len(urls), "URLs")
          except Exception as e:
              print("IndexNow failed:", e)
          PY
