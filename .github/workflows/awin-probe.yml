name: Awin offers probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Awin promotions API
        env:
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          pid = os.environ["AWIN_PUBLISHER_ID"]; tok = os.environ["AWIN_API_TOKEN"]
          def call(url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400].decode("utf-8", "ignore")
          for label, filters in [
              ("joined/active/GB", {"membership": "joined", "status": "active", "type": "all", "regionCodes": ["GB"]}),
              ("joined/all-status", {"membership": "joined", "type": "all"}),
          ]:
              body = {"filters": filters, "pagination": {"page": 1, "pageSize": 200}}
              st, d = call(f"https://api.awin.com/publisher/{pid}/promotions", body)
              if st != 200:
                  st2, d2 = call(f"https://api.awin.com/publisher/{pid}/promotions?accessToken={tok}", body)
                  print(f"[{label}] header-auth HTTP {st}: {d!s:.300}")
                  print(f"[{label}] query-auth  HTTP {st2}: {(d2 if isinstance(d2,str) else list(d2.keys()))!s:.300}")
                  st, d = st2, d2
              if st != 200:
                  continue
              ps = d.get("data") or d.get("promotions") or []; print("pagination", d.get("pagination"))
              print(f"[{label}] HTTP 200, top-level keys={list(d.keys())}, offers={len(ps)}")
              for p in ps:
                  adv = (p.get("advertiser") or {})
                  v = p.get("voucher") or {}
                  print(f"  - {adv.get('id')} {adv.get('name')!s:28.28} | {p.get('type'):9} | code={v.get('code') or '-':12} | {p.get('startDate','')[:10]} -> {p.get('endDate','')[:10]} | {p.get('title','')!s:.90}")
          PY
